<script>
// Hot reload do "npm run dev" (scripts/dev.mjs). Só em localhost; publicado, não faz nada.
if (["localhost", "127.0.0.1"].includes(location.hostname)) {
  const es = new EventSource("http://localhost:35729");
  es.onmessage = (e) => {
    if (e.data !== "css") return location.reload();
    document.querySelectorAll('link[rel="stylesheet"]').forEach((l) => {
      const u = new URL(l.href);
      if (u.origin === location.origin) { u.searchParams.set("v", Date.now()); l.href = u; }
    });
  };
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) es.close(); };
}
</script>
