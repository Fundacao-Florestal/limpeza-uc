  if(sI>(g("AreaInterna")||0))err.push("A soma das áreas internas detalhadas supera a área interna.");
  if(sE>(g("AreaExterna")||0))err.push("A soma das áreas externas detalhadas supera a área externa.");

function paramErr(p){
  const e=[];
  if(!(p.ProdInterna>0)||!(p.ProdExterna>0))e.push("As produtividades devem ser positivas.");
  if(!(p.V1<p.V2&&p.V2<p.V3&&p.P1<p.P2&&p.P2<p.P3))e.push("Os limites de faixas devem ser estritamente crescentes.");
  if(!(p.PequenaArea>0))e.push("A área de pequeno porte deve ser positiva.");

}
function calc(r,p){
  const v=r.Visitantes,pk=r.Pico,d=r.Dias,h=r.Horas;
  const IUP=(v<=0?0:v<=p.V1?1:v<=p.V2?2:v<=p.V3?3:4)+(pk<=p.P1?0:pk<=p.P2?1:pk<=p.P3?2:3)+(d<=3?0:d<=5?1:2)+(h<=4?0:h<=8?1:2)+r.Sazonalidade;
  const FaixaIUP=IUP<=3?"Baixo":IUP<=6?"Moderado":IUP<=9?"Intenso":"Muito intenso";
  const IPS=r.Sanitario===0?0:r.Publico*2+(v<=30?0:v<=300?1:2)+(pk<=100?0:pk<=800?1:2)+(r.HorasSan<=4?0:r.HorasSan<=8?1:2)+((r.Vasos+r.Mictorios)<=2?0:(r.Vasos+r.Mictorios)<=8?1:2)+r.Reposicao;
  const ClasseSan=r.Sanitario===0?"Não se aplica":r.Publico===0?"SAN-1":IPS<=5?"SAN-2":r.HorasSan<=8?"SAN-3":"SAN-4";
  const IH=r.Hospedaria===0?0:r.Hospedes/r.Leitos, IR=r.Hospedaria===0?0:r.Trocas/r.Quartos, IHOS=IH+IR;
  const FrequenciaExterna=r.AreaExterna===0?"Não se aplica":(r.Residuos>=2||IUP>=7)?"Semanal":(r.Residuos===1||IUP>=4)?"Quinzenal":"Mensal";
  const FatorExterno=r.AreaExterna===0?0:FrequenciaExterna==="Semanal"?1:FrequenciaExterna==="Quinzenal"?0.5:0.25;
  const cob=(IPS>=6||IUP>=7);
  const Modalidade=d===0?"Sem uso atual":cob?"Regular com cobertura":(r.AreaInterna<=p.PequenaArea&&d<=3)?"Volante":r.AreaInterna<=p.PequenaArea?"Compartilhado":"Regular";
  const Compartilhamento=d===0?"A avaliar":cob?"Baixo":r.AreaInterna<=p.PequenaArea?"Alto":"A avaliar";
  const CargaTecnica=((r.AreaInterna/p.ProdInterna)*(d/7)+(r.AreaExterna/p.ProdExterna)*FatorExterno)*(1+IUP*p.PesoIUP+IPS*p.PesoIPS+IHOS*p.PesoIHOS);
  return{IUP,FaixaIUP,IPS,ClasseSan,IH,IR,IHOS,FrequenciaExterna,FatorExterno,Modalidade,Compartilhamento,CargaTecnica};
}

function fbRole(){
  const a=S.acc||{},p=a.Perfil||null;
  S.isAdmin=S.isOwner=S.me.canEdit=(p==="admin");
  const key=JSON.stringify([p,a.UCs||[],a.Gerencias||[]]);

  FB_ROLE_KEY=key;fbStop(FB_ROLE_SUBS);S.recs=[];S.accAll=[];S.pedidos=[];S.usersAll=[];

  const errR=e=>{console.warn(e);setSync(false,"Leitura interrompida"+(e&&e.code?" ("+e.code+")":""))};
  const watch=(q,k)=>FB_ROLE_SUBS.push(q.onSnapshot(sn=>{
    parts.set(k,sn.docs.map(d=>d.data()));
    const m=new Map();parts.forEach(arr=>arr.forEach(x=>{if(x&&x.ID&&!x.Excluido)m.set(x.ID,x)}));
    S.recs=[...m.values()];setSync(true,"Base conectada");onData();

  else if(p==="gerente")(a.Gerencias||[]).forEach((g,i)=>watch(col.where("Gerencia","==",g),"g"+i));
  else if(p==="validador")ST_VALIDADOR.forEach((st,i)=>watch(col.where("Status","==",st),"v"+i));
  else if(p==="final")watch(col.where("Status","==","Homologado"),"f");
  else if(p==="gestor")watch(col.where("CriadoPor","==",S.me.id),"o");
  if(p==="admin"){
    FB_ROLE_SUBS.push(S.db.collection("acessos").onSnapshot(sn=>{S.accAll=sn.docs.map(d=>d.data());onData()},()=>{}));
    FB_ROLE_SUBS.push(S.db.collection("pedidos").onSnapshot(sn=>{S.pedidos=sn.docs.map(d=>d.data());onData()},()=>{}));
    FB_ROLE_SUBS.push(S.db.collection("usuarios").onSnapshot(sn=>{S.usersAll=sn.docs.map(d=>d.data());S.usersAll.forEach(x=>{S.names[x.Uid]=x.Nome||x.Email||"Usuário"});onData()},()=>{}));

  if(p)h=(S.me.name?esc(S.me.name)+" · ":"")+`<span class="pill info">${PERFIS[p]}${tester()?" (teste)":""}</span>`;
  else h="Sem perfil atribuído";
  if(perfil()==="admin"&&S.isAdmin&&S.db)h+=` <select class="vas" id="vAs" aria-label="Ver como">${[["","Administrador"],["gestor","Ver como Gestor"],["gerente","Ver como Gerente"],["validador","Ver como Validador final"],["final","Ver como Usuário final"]].map(([v,t])=>`<option value="${v}" ${S.viewAs===v?"selected":""}>${t}</option>`).join("")}</select>`;
  if(S.auth&&S.me.id)h+=`<span class="note" style="margin:0">${esc(S.me.email||"")}</span> <button class="btn sm" data-fb="logout">Sair</button>`;
  $("#whoami").innerHTML=h;
}

/* ============ Navegação ============ */
function go(v){S.view=v;render();window.scrollTo({top:0})}
function renderTabs(){
  const tb=tabsFor();if(!tb.some(t=>t[0]===S.view))S.view=tb[0][0];
  $("#tabs").innerHTML=tb.map(([k,l])=>`<button role="tab" data-view="${k}" aria-selected="${k===S.view}">${l}</button>`).join("");
}
function render(){
  const m=$("#main");
  if(S.auth&&!S.authReady){$("#tabs").innerHTML="";m.innerHTML='<div class="panel empty">Conectando…</div>';return}
  if(S.auth&&!S.me.id){$("#tabs").innerHTML="";$("#whoami").innerHTML="";m.innerHTML=vLogin();return}
  if(S.auth&&!S.me.verified){$("#tabs").innerHTML="";$("#whoami").innerHTML="";m.innerHTML=vVerify();return}
  if(!S.isOwner&&S.db&&S.me.id&&!S.accReady){$("#tabs").innerHTML="";renderWho();m.innerHTML='<div class="panel empty">Carregando perfil…</div>';return}
  if(!S.started){S.started=true;if(perfil()==="gestor")S.view="minha"}
  renderTabs();renderWho();
  if(S.view==="minha")m.innerHTML=vMinha();
  else if(S.view==="painel")m.innerHTML=vPainel();
  else if(S.view==="exp")vExp(m);
  else if(S.view==="acc"){m.innerHTML=vAcc();if(S.isAdmin&&S.db){names([...S.pedidos.map(p=>p.Uid),...S.accAll.map(a=>a.Uid)]).then(f=>{if(f&&S.view==="acc"&&!$("#dlg").open&&document.activeElement?.id!=="pSearch")$("#main").innerHTML=vAcc()})}}
  else if(S.view==="form")vForm(m);
  else if(S.view==="reg")m.innerHTML=vReg();
  else if(S.view==="par")m.innerHTML=vPar();
  else m.innerHTML=vGuia();
}

/* ============ Painel ============ */
function filtered(){return S.recs.filter(x=>inScope(x)&&(!S.fGer||x.Gerencia===S.fGer)&&(!S.fSt||x.Status===S.fSt)&&!(S.hideDemo&&x.Exemplo))}
function hbars(rows,fmt,alt){
  const mx=Math.max(...rows.map(r=>r.v),0)||1;
  return `<div class="hb">`+rows.map(r=>`<div class="lab">${esc(r.l)}</div><div class="track"><span class="fill ${alt?"alt":""}" style="width:${(r.v/mx*100).toFixed(1)}%"></span></div><div class="val">${fmt(r.v)}</div>`).join("")+`</div>`;
}
function filtersBar(){
  return `<div class="bar filters"><select id="fGer" aria-label="Gerência"><option value="">Todas as Gerências</option>${gersVis().map(g=>`<option ${S.fGer===g?"selected":""}>${g}</option>`).join("")}</select>
  <select id="fSt" aria-label="Situação"><option value="">Todas as situações</option>${STATUS.map(g=>`<option value="${g}" ${S.fSt===g?"selected":""}>${sl(g)}</option>`).join("")}</select>
  <span class="sp"></span><label class="sync"><input type="checkbox" id="fDemo" ${S.hideDemo?"checked":""} style="width:auto;min-height:0"> Ocultar exemplos</label><span class="sync">Regra: <span class="mono">${esc(S.params.VersaoRegra)}</span></span></div>`;
}
function vPainel(){
  const all=filtered(),R=all.filter(hasRes);
  if(!S.recs.length)return filtersBar()+`<div class="panel empty">Nenhum diagnóstico registrado. Use <b>Preenchimento</b> para cadastrar a primeira estrutura, quando o seu perfil permitir.</div>`;
  const cnt=s=>all.filter(x=>x.Status===s).length;
  const catN=new Set(UCS.filter(u=>ucInScope(u)&&(!S.fGer||u[2]===S.fGer)).map(u=>u[0]));const cov=new Set(all.filter(x=>catN.has(x.UC)).map(x=>x.UC)).size;
  const sumA=k=>R.reduce((a,x)=>a+(x[k]||0),0);
  const vtot=R.reduce((a,x)=>a+(valorRec(x)?.total||0),0);
  const valid=cnt("Validado")+cnt("Homologado"), hom=cnt("Homologado"), tot=all.length;
  const kp=`<div class="kpis">
    <div class="kpi"><div class="l">Estruturas registradas</div><div class="v">${f0(tot)}</div><div class="s">${f0(cov)} de ${f0(catN.size)} UCs do cadastro</div></div>
    <div class="kpi"><div class="l">Aprovadas pela Gerência</div><div class="v">${tot?Math.round(valid/tot*100):0}%</div><div class="s">${f0(valid)} de ${f0(tot)} · ${f0(hom)} com validação final</div></div>
    <div class="kpi"><div class="l">Aguardando aprovação</div><div class="v">${f0(cnt("Em validação"))}</div><div class="s">${f0(cnt("Devolvido"))} devolvidas</div></div>
    <div class="kpi"><div class="l">Área interna (m²)</div><div class="v">${f0(sumA("AreaInterna"))}</div><div class="s">registros concluídos</div></div>
    <div class="kpi"><div class="l">Área externa (m²)</div><div class="v">${f0(sumA("AreaExterna"))}</div><div class="s">registros concluídos</div></div>
    <div class="kpi"><div class="l">Valor referencial (R$/mês)</div><div class="v">${brl0(vtot)}</div><div class="s">CadTerc Vol. 03 · ${S.val.Regime==="ampla"?"participação ampla":"ME/EPP"}</div></div></div>`;
  const stk=`<div class="stack" role="img" aria-label="Andamento por situação">`+STATUS.map(s=>{const c=cnt(s);return c?`<span class="${stCls(s)}" style="flex:${c}">${c}</span>`:""}).join("")+`</div><div class="legend">`+STATUS.map(s=>`<span><span class="pill ${s==="Validado"||s==="Homologado"?"ok":s==="Devolvido"?"warn":s==="Em validação"?"info":""}">${sl(s)}</span> <b>${cnt(s)}</b></span>`).join("")+`</div>`;
  const byG=gersVis().map(g=>{const a=all.filter(x=>x.Gerencia===g),r=a.filter(hasRes);return{g,u:UCS.filter(u=>u[2]===g&&ucInScope(u)).length,uc:new Set(a.map(x=>x.UC).filter(n=>UCS.some(u=>u[0]===n))).size,n:a.length,v:a.filter(x=>x.Status==="Validado"||x.Status==="Homologado").length,p:a.filter(x=>x.Status==="Rascunho"||x.Status==="Devolvido").length,ai:r.reduce((s,x)=>s+x.AreaInterna,0),ae:r.reduce((s,x)=>s+x.AreaExterna,0),c:r.reduce((s,x)=>s+x.CargaTecnica,0),vr:r.reduce((s,x)=>s+(valorRec(x)?.total||0),0)}});
  const cg=hbars(byG.filter(x=>x.vr>0).sort((a,b)=>b.vr-a.vr).map(x=>({l:x.g,v:x.vr})),brl0);
  const cnts=(key,order)=>hbars(order.map(o=>({l:o,v:R.filter(x=>x[key]===o).length})),f0,true);
  const aten=R.filter(x=>x.IUP>=7||x.IPS>=6).sort((a,b)=>b.CargaTecnica-a.CargaTecnica).slice(0,8);
  const pend=all.filter(x=>x.Status==="Devolvido"||x.Status==="Rascunho").sort((a,b)=>(b.AtualizadoEm||"").localeCompare(a.AtualizadoEm||"")).slice(0,8);
  const fila=S.recs.filter(canApprove).length;
  const filaH=S.recs.filter(canHomolog).length;
  const bn2=filaH&&(perfil()==="validador"||perfil()==="admin")?`<div class="banner" style="background:var(--info-soft);color:var(--info)"><b>${filaH}</b> estrutura(s) aprovada(s) pela Gerência aguardando validação final. <button class="btn sm" data-act="filaH">Abrir fila</button></div>`:"";
  const bn=fila&&(perfil()==="gerente"||perfil()==="admin")?`<div class="banner" style="background:var(--info-soft);color:var(--info)"><b>${fila}</b> estrutura(s) aguardando aprovação. <button class="btn sm" data-act="fila">Abrir fila</button></div>`:"";
  return filtersBar()+bn+bn2+kp+`
  <div class="grid g2">
    <section class="panel"><h2>Andamento do preenchimento</h2><p class="sub">Situação de todas as estruturas do filtro</p>${stk}<p class="note">Só entram nos indicadores as estruturas concluídas (com resultado calculado).</p></section>
    <section class="panel"><h2>Valor referencial por Gerência</h2><p class="sub">Soma mensal dos registros concluídos, pela tabela do CadTerc</p>${cg||'<div class="empty">Sem registros concluídos.</div>'}</section>
  </div>
  <div class="grid g3">
    <section class="panel"><h2>Intensidade de uso (IUP)</h2><p class="sub">Estruturas por faixa, escala 0–13</p>${cnts("FaixaIUP",["Baixo","Moderado","Intenso","Muito intenso"])}</section>
    <section class="panel"><h2>Modalidade indicada</h2><p class="sub">Hipótese de atendimento, a confirmar</p>${cnts("Modalidade",["Regular com cobertura","Regular","Compartilhado","Volante","Sem uso atual"])}</section>
    <section class="panel"><h2>Classe sanitária</h2><p class="sub">Uso interno a intenso</p>${cnts("ClasseSan",["SAN-1","SAN-2","SAN-3","SAN-4","Não se aplica"])}</section>
  </div>
  <section class="panel" style="margin-top:16px"><h2>Situação por Gerência</h2><p class="sub">Cobertura do diagnóstico e dimensão do escopo</p><div class="tw"><table>
    <thead><tr><th>Gerência</th><th class="n">UCs no cadastro</th><th class="n">UCs com diagnóstico</th><th class="n">Estruturas</th><th class="n">Aprovadas</th><th class="n">Pendentes</th><th class="n">Área int. m²</th><th class="n">Área ext. m²</th><th class="n">Valor ref. R$/mês</th></tr></thead><tbody>
    ${byG.map(x=>`<tr class="${x.n?"":"zero"}"><td>${x.g}</td><td class="n">${x.u}</td><td class="n">${x.uc}</td><td class="n">${x.n}</td><td class="n">${x.v}</td><td class="n">${x.p}</td><td class="n">${f0(x.ai)}</td><td class="n">${f0(x.ae)}</td><td class="n">${f0(x.vr)}</td></tr>`).join("")}
    </tbody></table></div><p class="note">Cadastro: relação do Notion ("Áreas protegidas"), sincronizada em ${SYNC}. Gerência sem registro aparece em cinza: lacuna de cobertura, não ausência de estruturas.</p></section>
  <div class="grid g2">
    <section class="panel"><h2>Estruturas que exigem atenção</h2><p class="sub">IUP a partir de 7 ou IPS a partir de 6, por carga</p>
      ${aten.length?`<div class="tw"><table><thead><tr><th>Estrutura</th><th>UC</th><th>IUP</th><th class="n">IPS</th><th class="n">Carga</th></tr></thead><tbody>${aten.map(x=>`<tr class="click" data-open="${esc(x.ID)}"><td>${esc(x.Estrutura)}</td><td>${esc(x.UC)}</td><td>${iupPill(x.FaixaIUP)} <span class="mono">${x.IUP}</span></td><td class="n">${x.IPS}</td><td class="n">${f2(x.CargaTecnica)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Nenhuma estrutura no filtro atende ao critério.</div>'}</section>
    <section class="panel"><h2>Pendências de preenchimento</h2><p class="sub">Rascunhos e registros devolvidos</p>
      ${pend.length?`<div class="tw"><table><thead><tr><th>Estrutura</th><th>Gerência</th><th>Situação</th></tr></thead><tbody>${pend.map(x=>`<tr class="click" data-open="${esc(x.ID)}"><td>${esc(x.Estrutura||x.ID)}<div class="note" style="margin:0">${esc(x.UC)}${x.MotivoDevolucao&&x.Status==="Devolvido"?" · "+esc(x.MotivoDevolucao):""}</div></td><td>${esc(x.Gerencia)}</td><td>${stPill(x.Status)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Sem pendências.</div>'}</section>
  </div>
  <p class="note">O valor referencial é a estimativa mensal pela tabela do CadTerc (Vol. 03), aplicada às áreas informadas. Não é preço contratado. A carga técnica relativa é apenas índice comparativo, sem equivalência a trabalhadores nem a preço. Parâmetros e pesos marcados como proposta dependem de aprovação institucional.</p>`;
}

/* ============ Minhas UCs (Gestor) ============ */
function ucSum(rs){const o={n:0,val:0,eq:0,enc:0,hm:0,dias:0,jor:new Set()};rs.filter(x=>x.Status!=="Rascunho").forEach(x=>{const v=valorRec(x);if(!v)return;o.n++;o.val+=v.total;o.eq+=v.eq||0;o.enc+=v.enc||0;o.hm+=v.hm||0;o.dias=Math.max(o.dias,v.dias||0);if(!v.semUso)o.jor.add(v.jornada)});return o}
function kpiStrip(o){
  if(!o.n)return `<p class="note" style="margin:0 0 8px">Ainda não há estrutura enviada com valor calculado.</p>`;
  return `<div class="kpis" style="margin:8px 0 12px"><div class="kpi"><div class="l">Valor mensal alocado</div><div class="v">${brl(o.val)}</div><div class="s">${brl0(o.val*12)} em 12 meses</div></div>
  <div class="kpi"><div class="l">Equipe à disposição</div><div class="v">${f1(o.eq)}</div><div class="s">postos equivalentes, mais ${f2(o.enc)} de encarregado</div></div>
  <div class="kpi"><div class="l">Tempo de serviço</div><div class="v">${f0(o.hm)} h</div><div class="s">de trabalho por mês, ${f0(o.hm*12)} h em 12 meses</div></div>
  <div class="kpi"><div class="l">Dias de serviço</div><div class="v">${o.dias||"—"} por semana</div><div class="s">${[...o.jor].map(esc).join("; ")||"sem uso atual"}</div></div></div>
  <p class="note" style="margin:0 0 8px">Considera ${o.n} estrutura(s) enviada(s), exceto rascunhos. Equipe e horas são estimativas gerenciais pelos coeficientes do CadTerc Vol. 03, e não podem ser exigidas no edital (item 1.11).</p>`;
}
function resumoUCs(ucs){
  const rs=S.recs.filter(x=>ucs.includes(x.UC)&&!(S.hideDemo&&x.Exemplo));
  return `<section class="panel" style="margin-bottom:14px"><h2 style="font-size:18px">Resumo das minhas UCs</h2><p class="sub">${ucs.length} UC(s). Valor, equipe e tempo estimados a partir das áreas informadas.</p>${kpiStrip(ucSum(rs))}</section>`;
}
function vMinha(){
  let ucs=perfil()==="gestor"&&!tester()?[...myUCs()]:[...new Set(S.recs.filter(inScope).map(x=>x.UC))];
  ucs.sort((a,b)=>a.localeCompare(b));
  if(!ucs.length)return `<div class="panel empty">Nenhuma UC atribuída ao seu perfil. Solicite a atribuição ao administrador.</div>`;
  return `<p class="note" style="margin:0 0 12px">Cada UC pode ter várias estruturas. Use <b>Adicionar estrutura</b> para cadastrar a próxima; no formulário, <b>Enviar e cadastrar outra</b> mantém a mesma UC.</p>`+resumoUCs(ucs)+ucs.map(uc=>{
    const rs=S.recs.filter(x=>x.UC===uc).sort((a,b)=>(a.Estrutura||"").localeCompare(b.Estrutura||"")),u=UCS.find(z=>z[0]===uc);
    const c=s=>rs.filter(x=>x.Status===s).length,n=rs.length,dev=c("Devolvido");
    return `<section class="panel" style="margin-bottom:14px"><div class="bar" style="margin:0 0 8px"><h2 style="font-size:18px">${esc(uc)}</h2>${u?`<span class="pill ok">${u[2]}</span><span class="pill">${esc(CATS[u[1]])}</span>`:""}<span class="sp"></span><button class="btn pri" data-act="novaUc" data-nuc="${esc(uc)}">Adicionar estrutura</button></div>
    <p class="note" style="margin:0 0 8px">${n?`${n} estrutura(s): ${c("Validado")} aprovada(s) pela Gerência, ${c("Homologado")} com validação final, ${c("Em validação")} em aprovação, ${c("Rascunho")} rascunho(s), ${dev} devolvida(s).`:"Nenhuma estrutura cadastrada ainda."}</p>
    ${n?kpiStrip(ucSum(rs)):""}
    ${dev?`<div class="banner">${dev} estrutura(s) devolvida(s) aguardando correção.</div>`:""}
    ${n?`<div class="tw"><table><thead><tr><th>Estrutura</th><th>Situação</th><th>Responsável</th><th class="n">Valor (R$/mês)</th><th class="n">Equipe eq.</th><th>Atualizado</th></tr></thead><tbody>${rs.map(x=>`<tr class="click" data-open="${esc(x.ID)}"><td>${esc(x.Estrutura)}${x.Exemplo?' <span class="pill">Exemplo</span>':""}${x.Status==="Devolvido"&&x.MotivoDevolucao?`<div class="note" style="margin:0">${esc(x.MotivoDevolucao)}</div>`:""}</td><td>${stPill(x.Status)}</td><td>${esc(x.Responsavel||"—")}</td><td class="n">${hasRes(x)?f2(valorRec(x).total):"—"}</td><td class="n">${hasRes(x)?f2(valorRec(x).eq):"—"}</td><td>${fdt(x.AtualizadoEm)}</td></tr>`).join("")}</tbody></table></div>`:""}</section>`}).join("");
}

/* ============ Registros ============ */
function vReg(){
  const q=S.fQ.toLowerCase();
  const rows=filtered().filter(x=>!q||[x.ID,x.UC,x.Estrutura,x.Responsavel].some(t=>String(t||"").toLowerCase().includes(q))).sort((a,b)=>(b.AtualizadoEm||"").localeCompare(a.AtualizadoEm||""));
  return `<div class="bar filters"><input type="text" id="fQ" placeholder="Buscar por UC, estrutura ou responsável" value="${esc(S.fQ)}" aria-label="Buscar"><select id="fGer" aria-label="Gerência"><option value="">Todas as Gerências</option>${gersVis().map(g=>`<option ${S.fGer===g?"selected":""}>${g}</option>`).join("")}</select>
   <select id="fSt" aria-label="Situação"><option value="">Todas as situações</option>${STATUS.map(g=>`<option value="${g}" ${S.fSt===g?"selected":""}>${sl(g)}</option>`).join("")}</select><span class="sp"></span>
   <label class="sync"><input type="checkbox" id="fDemo" ${S.hideDemo?"checked":""} style="width:auto;min-height:0"> Ocultar exemplos</label>${perfil()==="admin"?`<button class="btn" data-act="csv">Exportar CSV (modelo)</button>`:""}${canFill()?`<button class="btn pri" data-act="novo">Novo diagnóstico</button>`:""}</div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Estrutura</th><th>UC / Gerência</th><th>Situação</th><th>Responsável</th><th>IUP</th><th>Classe san.</th><th>Modalidade</th><th class="n">Valor ref. (R$/mês)</th><th>Atualizado</th></tr></thead><tbody>
  ${rows.map(x=>`<tr class="click" data-open="${esc(x.ID)}"><td>${esc(x.Estrutura)}${x.Exemplo?' <span class="pill">Exemplo</span>':""}</td><td>${esc(x.UC)}<div class="note" style="margin:0">${esc(x.Gerencia)}</div></td><td>${stPill(x.Status)}</td><td>${esc(x.Responsavel||"—")}</td><td>${hasRes(x)?iupPill(x.FaixaIUP)+' <span class="mono">'+x.IUP+'</span>':"—"}</td><td>${hasRes(x)?esc(x.ClasseSan):"—"}</td><td>${hasRes(x)?esc(x.Modalidade):"—"}</td><td class="n">${hasRes(x)?f2(valorRec(x).total):"—"}</td><td>${fdt(x.AtualizadoEm)}</td></tr>`).join("")||`<tr><td colspan="8" class="empty">Nenhum registro para o filtro.</td></tr>`}
  </tbody></table></div></div>`;
}
async function openRec(id){
  const x=S.recs.find(r=>r.ID===id);if(!x)return;
  await names([x.CriadoPor,...(x.Hist||[]).map(h=>h.por)]);
  const kv=(l,v)=>`<div><span>${l}</span><b>${v}</b></div>`;
  const canV=canApprove(x),canH=canHomolog(x),canE=canEditRec(x),vv=valorRec(x);
  $("#dlgBody").innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h2>${esc(x.Estrutura)}</h2><p class="note" style="margin:2px 0 0">${esc(x.UC)} · ${esc(x.Gerencia)} · <span class="mono">${esc(x.ID)}</span> · revisão ${x.Revisao||1}</p><p class="note" style="margin:2px 0 0">Responsável pelo preenchimento: <b>${esc(x.Responsavel||"—")}</b>${x.Contato?" · "+esc(x.Contato):""}</p></div>${stPill(x.Status)}</div>
  ${hasRes(x)?`<div class="kv">${kv("IUP",x.IUP+" · "+esc(x.FaixaIUP))}${kv("IPS / classe",x.IPS+" · "+esc(x.ClasseSan))}${kv("IHOS",f2(x.IHOS))}${kv("Frequência externa",esc(x.FrequenciaExterna))}${kv("Modalidade",esc(x.Modalidade))}${kv("Compartilhamento",esc(x.Compartilhamento))}${kv("Carga técnica relativa",f2(x.CargaTecnica))}${kv("Área interna / externa",f0(x.AreaInterna)+" / "+f0(x.AreaExterna)+" m²")}${kv("Versão da regra",esc(x.VersaoRegra))}${kv("Valor referencial total",brl(vv.total))}${kv("Equipe equivalente",f2(vv.eq)+" postos + "+f2(vv.enc)+" enc.")}${kv("Horas de serviço por mês",f0(vv.hm))}${kv("Dias de serviço",vv.dias?vv.dias+" por semana":"—")}</div>${valTable(vv)}`:`<p class="note">Rascunho sem indicadores. Conclua o preenchimento para calcular.</p>`}
  ${x.Status==="Devolvido"&&x.MotivoDevolucao?`<div class="banner">Devolvido: ${esc(x.MotivoDevolucao)}</div>`:""}
  ${x.Observacoes?`<p class="note">Observações: ${esc(x.Observacoes)}</p>`:""}
  <h3 style="font-size:14px;margin-top:14px">Histórico</h3><ul class="hist">${(x.Hist||[]).slice().reverse().map(h=>`<li><b>${esc(sl(h.de))} → ${esc(sl(h.para))}</b> · ${esc(who(h.por))} · ${fdt(h.em)}${h.motivo?"<br>"+esc(h.motivo):""}</li>`).join("")||"<li>Sem eventos.</li>"}</ul>
  ${canV||canH?`<label class="f" style="margin-top:14px">Motivo (obrigatório para devolver)<textarea id="motivo" rows="2"></textarea></label>`:""}

  S.ucQ="";S.ucG="";S.ucManual=false;S.autoName="";return r}
function ucPool(){const s=myUCs();return UCS.map((u,i)=>[u,i]).filter(([u])=>s.has(u[0]))}

}

const isAutoName=(r,tipo)=>{const n=String(r.Estrutura||"").trim();return !n||(!!tipo&&(n===tipo||new RegExp("^"+tipo.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+" \\d+$").test(n)))};
function uniqueName(r,base){
  const taken=n=>S.recs.some(x=>x.UC===r.UC&&x.ID!==r.ID&&norm(x.Estrutura)===norm(n));
  if(!r.UC||!taken(base))return base;
  for(let i=2;i<100;i++){if(!taken(base+" "+i))return base+" "+i}
  return base;
}
function pickTipo(t){
  const r=S.form;const auto=isAutoName(r,r.Tipo);r.Tipo=t;
  if(auto)r.Estrutura=uniqueName(r,t);
  refreshInputs();refreshCheck();
}
async function freshId(r){
  const base=norm(r.UC).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").toUpperCase().slice(0,30)||"UC";
  /* sufixo do autor: evita colisão de IDs entre pessoas que não enxergam os envios umas das outras */
  let h=0;for(const c of String(S.me.id||"x"))h=(h*31+c.charCodeAt(0))>>>0;
  const sfx=h.toString(36).toUpperCase().slice(-3).padStart(3,"0");
  for(let n=1;n<500;n++){
    const id=base+"-"+String(n).padStart(2,"0")+"-"+sfx;
    if(S.recs.some(x=>x.ID===id))continue;
    return id;
  }
  return base+"-"+Date.now().toString(36).toUpperCase();
}

const MEAS=[["AreaInterna","Área interna (m²)","sum"],["AreaExterna","Área externa (m²)","sum"],["AreaSanitaria","Área sanitária (m²)","sum"],["Pessoas","Pessoas na equipe","sum"],["Visitantes","Visitantes por dia","sum"],["Pico","Pico de visitantes","sum"],["Vasos","Vasos","sum"],["Mictorios","Mictórios","sum"],["Lavatorios","Lavatórios","sum"],["Chuveiros","Chuveiros","sum"],["Leitos","Leitos","sum"],["Quartos","Quartos","sum"],["Hospedes","Hóspedes no mês","sum"],["Trocas","Trocas no mês","sum"],["Lixeiras","Lixeiras","sum"],["Dias","Dias de uso por semana","avg"],["Horas","Horas de uso por dia","avg"],["IUP","IUP","avg"],["IPS","IPS","avg"],["IHOS","IHOS","avg"],["CargaTecnica","Carga técnica relativa","sum"],["ValorMensal","Valor referencial (R$/mês)","sum"],["Equipe","Equipe equivalente (postos)","sum"],["HorasMes","Horas de serviço por mês","sum"]];
const CATG=[["FaixaIUP","Faixa do IUP"],["ClasseSan","Classe sanitária"],["Modalidade","Modalidade indicada"],["Compartilhamento","Compartilhamento"],["FrequenciaExterna","Frequência externa"]];
const MGROUPS=[["Áreas",["AreaInterna","AreaExterna","AreaSanitaria"]],["Uso e equipe",["Pessoas","Visitantes","Pico","Dias","Horas"]],["Sanitários",["Vasos","Mictorios","Lavatorios","Chuveiros"]],["Hospedagem",["Leitos","Quartos","Hospedes","Trocas"]],["Exterior",["Lixeiras"]],["Indicadores",["IUP","IPS","IHOS","CargaTecnica"]],["Valor e equipe estimada (CadTerc)",["ValorMensal","Equipe","HorasMes"]]];
function expInit(){if(!S.exp)S.exp={lvl:"uc",ger:new Set(),st:new Set(["Homologado"]),meas:new Set(["AreaInterna","AreaExterna","CargaTecnica"]),cats:new Set(),resp:false,items:new Set()}}
const itemMeas=e=>ITEMS.filter(i=>e.items.has(i[0])).flatMap(i=>[["I:a:"+i[0],"Área · "+i[1]+" (m²)","sum"],["I:v:"+i[0],"R$/mês · "+i[1],"sum"]]);
function expPreset(k){
  const e=S.exp;e.items=new Set();
  if(k==="anexo"){e.lvl="uc";e.meas=new Set(["AreaInterna","AreaExterna","ValorMensal"]);e.items=new Set(ITEMS.map(i=>i[0]));e.cats=new Set()}
  else if(k==="ger"){e.lvl="ger";e.meas=new Set(["AreaInterna","AreaExterna","CargaTecnica"]);e.cats=new Set()}
  else if(k==="uc"){e.lvl="uc";e.meas=new Set(["AreaInterna","AreaExterna","Visitantes","IUP","CargaTecnica"]);e.cats=new Set()}
  else{e.lvl="est";e.meas=new Set(MEAS.map(m=>m[0]));e.cats=new Set(CATG.map(c=>c[0]))}
  vExpRefresh();
}
function expRows(){
  const e=S.exp,fin=perfil()==="final";
  return S.recs.filter(x=>inScope(x)&&(!e.ger.size||e.ger.has(x.Gerencia))&&(fin||!e.st.size||e.st.has(x.Status))&&!(S.hideDemo&&x.Exemplo));
}
const rnd=v=>v==null?null:Math.round(v*10000)/10000;
function expBuild(){
  const e=S.exp,rows=expRows(),meas=[...MEAS.filter(m=>e.meas.has(m[0])),...itemMeas(e)],cats=CATG.filter(c=>e.cats.has(c[0]));
  const val=(x,k)=>{let v;if(k==="ValorMensal")v=valorRec(x)?.total;else if(k==="Equipe")v=valorRec(x)?.eq;else if(k==="HorasMes")v=valorRec(x)?.hm;else if(k.startsWith("I:")){const[,t,ik]=k.split(":"),vv=valorRec(x);v=vv?vv.linhas.filter(l=>l.k===ik).reduce((a,l)=>a+(t==="a"?l.a:l.t),0):undefined}else v=x[k];return typeof v==="number"&&isFinite(v)?v:null};
  let head,body;
  if(e.lvl==="est"){
    head=["Gerência","UC","Categoria","Estrutura","Uso principal",...(e.resp?["Responsável"]:[]),"Situação",...meas.map(m=>m[1]),...cats.map(c=>c[1])];
    body=rows.slice().sort((a,b)=>(a.Gerencia+a.UC+a.Estrutura).localeCompare(b.Gerencia+b.UC+b.Estrutura)).map(x=>[x.Gerencia,x.UC,x.Categoria||"",x.Estrutura,x.Tipo,...(e.resp?[x.Responsavel||""]:[]),sl(x.Status),...meas.map(m=>rnd(val(x,m[0]))),...cats.map(c=>x[c[0]]??"")]);
  }else{
    const key=e.lvl==="uc"?"UC":"Gerencia",gr=new Map();
    rows.forEach(x=>{const k=x[key]||"(sem valor)";if(!gr.has(k))gr.set(k,[]);gr.get(k).push(x)});
    const agg=(a,m)=>{const v=a.map(x=>val(x,m[0])).filter(n=>n!=null);if(!v.length)return null;const s=v.reduce((p,q)=>p+q,0);return rnd(m[2]==="avg"?s/v.length:s)};
    const mh=meas.map(m=>m[1]+(m[2]==="avg"?" — média":" — soma"));
    if(e.lvl==="uc"){head=["Gerência","UC","Categoria","Nº de estruturas",...mh];
      body=[...gr].sort((a,b)=>(a[1][0].Gerencia+a[0]).localeCompare(b[1][0].Gerencia+b[0])).map(([k,a])=>[a[0].Gerencia,k,a[0].Categoria||"",a.length,...meas.map(m=>agg(a,m))])}
    else{head=["Gerência","UCs no cadastro","UCs com diagnóstico","Nº de estruturas",...mh];
      body=[...gr].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,a])=>[k,UCS.filter(u=>u[2]===k).length,new Set(a.map(x=>x.UC)).size,a.length,...meas.map(m=>agg(a,m))])}
  }
  return{head,body};
}

async function loadXlsx(){
  if(window.XLSX)return window.XLSX;
  await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  if(!window.XLSX)throw 0;return window.XLSX;
}
const expName=ext=>"limpeza_uc_"+S.exp.lvl+"_"+new Date().toISOString().slice(0,10)+"."+ext;
async function saveFile(name,data){
  try{downloadFile(name,data,"text/csv;charset=utf-8");toast("Arquivo salvo.")}
  catch(e){if(e&&e.code==="declined")return;toast("Download indisponível nesta visualização.")}
}
async function exportXlsx(){
  const{head,body}=expBuild();if(!body.length)return;
  let X;try{X=await loadXlsx()}catch{toast("Biblioteca de Excel indisponível. Exportando em CSV.");return exportExpCsv()}
  const e=S.exp,wb=X.utils.book_new(),ws=X.utils.aoa_to_sheet([head,...body]);
  ws["!cols"]=head.map((c,i)=>({wch:Math.min(42,Math.max(10,c.length+2,...body.slice(0,60).map(r=>String(r[i]??"").length+2)))}));
  X.utils.book_append_sheet(wb,ws,"Dados");
  const crit=[["Limpeza das UCs · exportação"],["Gerado em",new Date().toLocaleString("pt-BR")],["Gerado por",S.me.name||""],["Perfil",PERFIS[perfil()]||""],["Nível",{est:"Estrutura",uc:"UC",ger:"Gerência"}[e.lvl]],["Gerências",e.ger.size?[...e.ger].join(", "):"Todas"],["Situação",perfil()==="final"?"Validado final":(e.st.size?[...e.st].map(sl).join(", "):"Todas")],["Linhas",body.length],["Versão da regra",S.params.VersaoRegra],["Cadastro de UCs","Notion (Áreas protegidas), sincronizado em "+SYNC],["Tabela de valores",S.val.Versao],["Regime de licitação",S.val.Regime==="ampla"?"Participação ampla":"Participação restrita a ME/EPP"],["Fator de reajuste",S.val.Fator],["Observação","Valor referencial = área × valor unitário do CadTerc Vol. 03 por tipo de serviço; é estimativa, não preço contratado. Carga técnica é índice comparativo, não é nº de postos nem preço. Somas e médias ignoram campos vazios."]];
  X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(crit),"Critérios");
  const out=X.write(wb,{bookType:"xlsx",type:"array"});
  await saveFile(expName("xlsx"),new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
async function exportExpCsv(){
  const{head,body}=expBuild();
  const q=v=>{if(v==null)return"";const s=typeof v==="number"?String(v).replace(".",","):String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  await saveFile(expName("csv"),"﻿"+head.map(q).join(";")+"\n"+body.map(r=>r.map(q).join(";")).join("\n"));
}

function readVal(){
  const v={Versao:$("#v_Versao").value.trim()||VDEF.Versao,Regime:$("#v_Regime").value,Fator:Number($("#v_Fator").value),LimitePequena:Number($("#v_LimitePequena").value)};
  ["ampla","restrita"].forEach(rg=>{v[rg]={geral:{},pequena:{},parque:{}};["geral","pequena"].forEach(tb=>ITEMS.forEach(i=>v[rg][tb][i[0]]=Number($(`#v_${rg}_${tb}_${i[0]}`).value)));["varr","posto8","posto16"].forEach(k=>v[rg].parque[k]=Number($(`#v_${rg}_parque_${k}`).value))});
  return v;
}
function valErr(v){
  const e=[],all=[];["ampla","restrita"].forEach(rg=>["geral","pequena","parque"].forEach(tb=>Object.values(v[rg][tb]).forEach(n=>all.push(n))));
  if(all.some(n=>!isFinite(n)||n<0))e.push("Todos os valores devem ser números não negativos.");
  if(!(v.Fator>0))e.push("O fator de reajuste deve ser positivo.");
  if(!(v.LimitePequena>0))e.push("O limite de pequenas áreas deve ser positivo.");
  return e;
}
async function saveVal(){
  const v=readVal(),e=valErr(v);$("#verr").innerHTML=e.map(t=>`<li>${esc(t)}</li>`).join("");if(e.length)return;
  try{if(S.db)await S.db.doc("config/valores").set(v);S.val=dm(VDEF,v);toast("Tabela de valores publicada. Vale para novos envios; registros já enviados mantêm o valor da época.");render()}catch(x){toast("Não foi possível gravar: "+(x.message||x.code))}
}
function fillVal(v){$("#v_Versao").value=v.Versao;$("#v_Regime").value=v.Regime;$("#v_Fator").value=v.Fator;$("#v_LimitePequena").value=v.LimitePequena;["ampla","restrita"].forEach(rg=>{["geral","pequena"].forEach(tb=>ITEMS.forEach(i=>$(`#v_${rg}_${tb}_${i[0]}`).value=v[rg][tb][i[0]]));["varr","posto8","posto16"].forEach(k=>$(`#v_${rg}_parque_${k}`).value=v[rg].parque[k])})}

/* ============ Guia do painel ============ */
function vGuia(){
  const rows=[
   ["Andamento","Estruturas por situação (Rascunho, Em aprovação, Aprovado pela Gerência, Validado final, Devolvido) e % aprovado.","Cadastro","Gerente, Usuário final","Mostra onde o diagnóstico está parado. Meta de cobertura depende da lista oficial de estruturas."],

   ["Cobertura de UCs","UCs do cadastro com ao menos uma estrutura registrada, por Gerência.","Notion (Áreas protegidas) + cadastro","Gerente, Usuário final","Mostra quantas das 169 áreas já têm diagnóstico. Atualizar a relação ao mudar o cadastro."],

   ["Carga técnica relativa","[(Área int. / produtividade) × (dias/7) + (área ext. / produtividade) × fator externo] × (1 + pesos × índices).","Regra + parâmetros","Usuário final","Índice analítico para priorizar. Não é nº de postos nem preço, e não entra no cálculo do valor."],
   ["IUP","Intensidade de uso, 0 a 13, por faixa (baixo, moderado, intenso, muito intenso).","Visitação, dias, horas, sazonalidade","Gerente, Gestor","Prioriza estruturas de maior pressão de uso."],
   ["Classe sanitária","SAN-1 a SAN-4, a partir do IPS e da disponibilidade horária.","Sanitários","Gerente","Hipótese analítica, não enquadramento normativo."],
   ["Modalidade indicada","Regular, com cobertura, compartilhado, volante ou sem uso.","Área, dias, IUP, IPS","Usuário final","Confirmar distância, acesso e logística antes de decidir."],
   ["Atenção","Estruturas com IUP ≥ 7 ou IPS ≥ 6, por carga.","Resultados","Gerente","Lista de trabalho para revisão e visita."],
   ["Pendências","Rascunhos e devolvidos, com motivo.","Fluxo de aprovação","Gestor, Gerente","Cobrança objetiva de correção."]];
  return `<div class="panel"><h2>Proposta do painel gerencial</h2><p class="sub">Leitura pretendida, fonte e cautela de cada bloco. Atualização: em tempo real nesta versão; em produção, diária a partir da tabela Diagnosticos.</p>
  <div class="tw guide"><table><thead><tr><th>Bloco</th><th>Definição</th><th>Fonte</th><th>Público</th><th>Cautela</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <h3 style="font-size:15px;margin-top:20px">Como o valor referencial é calculado</h3>
  <div class="tw"><table><tbody>
   <tr><td>Base</td><td>Prestação de Serviços de Limpeza, Asseio e Conservação Predial, Vol. 03 do CadTerc (data-base jan/2023, versão 02 de set/2023). Valor mensal de cada tipo de serviço = área de piso (projeção horizontal, sem paredes, portas e divisórias) × valor unitário em R$/m²/mês.</td></tr>
   <tr><td>Tabela aplicada</td><td>Se construído + externo somam até 750 m², vale a tabela de pequenas áreas (Apêndice 4); acima disso, a tabela geral (Capítulo III). Parques estaduais usam o Apêndice 3 para varrição e para os postos sanitários. O regime (ampla ou restrita a ME/EPP) e o fator de reajuste são definidos em Parâmetros.</td></tr>
   <tr><td>Áreas internas</td><td>Quem preenche pode detalhar acarpetado, laboratório, almoxarifado, oficina e saguão. O restante da área interna é valorado como piso frio (ou almoxarifado, se o uso for galpão/oficina).</td></tr>
   <tr><td>Sanitários</td><td>O sanitário de uso público classe SAN-3 ou SAN-4 é valorado como "sanitário de grande circulação". Em parque, vira posto sanitário (SAN-3 = 8 h, SAN-4 = 16 h; 1 posto por estrutura) e sai da área em m². Os demais sanitários ficam no piso frio.</td></tr>
   <tr><td>Áreas externas</td><td>Pisos pavimentados e varrição podem ser detalhados. O restante da área externa é valorado como pátio e área verde na frequência calculada: semanal = alta, quinzenal = média, mensal = baixa.</td></tr>
   <tr><td>Fora do cálculo</td><td>Limpeza de vidros externos e coleta de detritos em pátios (R$/ha) não são coletadas neste levantamento. Estrutura com 0 dia de uso por semana tem valor zero. Carga técnica, IUP e IPS não alteram o valor.</td></tr>
   <tr><td>Equipe e tempo</td><td>Estimativa gerencial: área ÷ produtividade do CadTerc (m² por funcionário, por tipo de serviço) dá os postos equivalentes, mais 1 encarregado para cada 30. Horas por mês = postos × jornada de referência (44 h por semana na tabela geral; 24 h por semana, meio período, nas pequenas áreas; pátios pela frequência do quadro de periodicidades). Dias: 2ª a sábado, ou 7 dias nos serviços de parque. Não é exigência contratual: o documento veda produtividades e quantitativos de profissionais no edital (item 1.11).</td></tr>
   <tr><td>Congelamento</td><td>O valor é gravado ao enviar o diagnóstico, com a tabela vigente. Mudar a tabela vale para os próximos envios.</td></tr></tbody></table></div>
  <h3 style="font-size:15px;margin-top:20px">Perfis e fluxo</h3>
  <div class="tw"><table><thead><tr><th>Perfil</th><th>Faz</th><th>Vê</th></tr></thead><tbody>
   <tr><td>Gestor</td><td>Preenche os diagnósticos das UCs sob sua responsabilidade, uma estrutura por vez ("Adicionar estrutura" ou "Enviar e cadastrar outra"), e envia para aprovação. Corrige o que for devolvido.</td><td>Somente o que ele próprio enviou, nas UCs atribuídas. Envios de outras pessoas não aparecem.</td></tr>
   <tr><td>Gerente</td><td>Aprova ou devolve (com motivo obrigatório) os diagnósticos da sua Gerência.</td><td>Somente a sua Gerência.</td></tr>
   <tr><td>Validador final</td><td>Faz a validação final dos diagnósticos aprovados pelos Gerentes ("Validar (final)") ou os devolve ao gestor, com motivo obrigatório. Também exporta.</td><td>Diagnósticos aprovados pela Gerência e já validados, de todas as UCs.</td></tr>
   <tr><td>Usuário final</td><td>Consulta o painel e monta a tabela Excel com os quantitativos que precisa.</td><td>Somente diagnósticos com validação final, de todas as UCs.</td></tr>
   <tr><td>Administrador</td><td>Atribui perfis (UCs do Gestor, Gerências do Gerente), mantém parâmetros e o cadastro. Pode testar cada perfil em "Ver como".</td><td>Tudo, inclusive todos os envios recebidos.</td></tr></tbody></table></div>
  <p class="note" style="max-width:70ch">Fluxo: Rascunho → Em aprovação (Gerente) → Aprovado pela Gerência (Validador final) → Validado final, ou Devolvido ao gestor em qualquer das duas etapas. Editar um diagnóstico já aprovado abre nova revisão e exige nova aprovação e nova validação final. Quem entra sem perfil vê apenas a tela de solicitação de acesso.</p>
  <p class="note" style="max-width:70ch">O controle de perfis é aplicado pelo próprio banco (regras do Firestore): cada pessoa só lê e grava o que o seu perfil permite, mesmo fora desta interface.</p></div>`;
}

  const cols=[...TXT.filter(k=>!["Observacoes","UCTipo","UCCadastro","Responsavel","Contato"].includes(k)),...NUM,...ITENS,"Observacoes","Status",...RES,"ValorMensal","VersaoRegra"];

  const csv="﻿"+cols.join(";")+"\n"+filtered().map(x=>cols.map(k=>q(x[k])).join(";")).join("\n");

/* ============ Eventos ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,tr[data-open]");if(!t)return;
  if(t.dataset.view){go(t.dataset.view);return}
  if(t.dataset.open){openRec(t.dataset.open);return}
  if(t.dataset.flag){setFlag(t.dataset.flag,Number(t.dataset.v));return}
  if(t.dataset.uc!==undefined){pickUc(Number(t.dataset.uc));return}
  if(t.dataset.tipo){pickTipo(t.dataset.tipo);return}
  if(t.dataset.ucg!==undefined){S.ucG=t.dataset.ucg;renderUcBox();return}
  if(t.dataset.eg){toggle(S.exp.ger,t.dataset.eg);vExpRefresh();return}
  if(t.dataset.est){toggle(S.exp.st,t.dataset.est);vExpRefresh();return}
  if(t.dataset.elvl){S.exp.lvl=t.dataset.elvl;vExpRefresh();return}
  if(t.dataset.epre){expPreset(t.dataset.epre);return}
  if(t.dataset.asgp){S.asg.perfil=t.dataset.asgp;renderAsg();return}
  if(t.dataset.asgg){UCS.filter(u=>u[2]===t.dataset.asgg).forEach(u=>S.asg.ucs.add(u[0]));renderAsgList();return}
  if(t.dataset.asgclear!==undefined){S.asg.ucs.clear();renderAsgList();return}
  if(t.dataset.psel){openAsg(t.dataset.psel);return}
  const a=t.dataset.act;if(!a)return;
  if(a==="fila"){S.fSt="Em validação";S.fGer="";go("reg")}
  else if(a==="filaH"){S.fSt="Validado";S.fGer="";go("reg")}
  else if(a==="homologar")transition(t.dataset.id,"Homologado","");
  else if(a==="novo"){S.form=newForm();S.edit=null;go("form")}
  else if(a==="cancelar"){const was=!!S.edit;S.form=null;S.edit=null;go(was?(perfil()==="gestor"?"minha":"reg"):(perfil()==="gestor"?"minha":"painel"))}
  else if(a==="rascunho")submit(false);
  else if(a==="concluir")submit(true);
  else if(a==="concluirmais")submit(true,true);
  else if(a==="novaUc"){S.form=newForm();applyUc(S.form,t.dataset.nuc);S.edit=null;S.ucManual=false;go("form")}
  else if(a==="csv")exportCsv();
  else if(a==="trocaruc"){S.form.UC="";S.form.Gerencia="";S.form.Categoria="";S.form.UCTipo="";S.ucQ="";S.ucG="";renderUcBox();refreshCheck();const q=$("#ucQ");q&&q.focus()}
  else if(a==="ucmanual"){S.ucManual=true;S.form.UC="";S.form.Gerencia="";S.form.Categoria="";S.form.UCTipo="";S.form.UCCadastro="Manual";renderUcBox();refreshCheck()}
  else if(a==="ucvoltar"){S.ucManual=false;S.form.UC="";S.form.Gerencia="";S.form.Categoria="";S.form.UCTipo="";S.form.UCCadastro="Notion";renderUcBox();refreshCheck()}
  else if(a==="dup"){const x=S.recs.find(r=>r.ID===t.dataset.id);if(!x)return;S.form={...blankRec(),...Object.fromEntries([...TXT,...NUM,...ITENS].map(k=>[k,x[k]??(NUMK(k)?null:"")]))};S.form.ID="";S.form.Observacoes="";S.form.Responsavel=S.me.name||S.form.Responsavel;S.form.Estrutura=x.Estrutura+" (cópia)";S.edit=null;S.ucManual=false;$("#dlg").close();go("form")}
  else if(a==="fechar")$("#dlg").close();
  else if(a==="outra"){$("#dlg").close();S.form=newForm();Object.assign(S.form,S._keep||{});S.ucManual=false;S.view="form";render();window.scrollTo({top:0})}
  else if(a==="edit"){const x=S.recs.find(r=>r.ID===t.dataset.id);if(!x)return;S.form={...blankRec(),...Object.fromEntries([...TXT,...NUM,...ITENS].map(k=>[k,x[k]??(NUMK(k)?null:"")]))};S.edit=x;$("#dlg").close();go("form")}
  else if(a==="validar")transition(t.dataset.id,"Validado","");
  else if(a==="devolver")transition(t.dataset.id,"Devolvido",$("#motivo")?.value||"");
  else if(a==="excluir"){const id=t.dataset.id;(async()=>{try{const x=S.recs.find(r=>r.ID===id);if(!x)return;await delRec(x);$("#dlg").close();toast("Rascunho excluído.");render()}catch(x){toast("Não foi possível excluir.")}})()}
  else if(a==="salvarpar")savePar();
  else if(a==="salvarval")saveVal();
  else if(a==="padraoval")fillVal(VDEF);
  else if(a==="asg")openAsg(t.dataset.uid);
  else if(a==="asgsalvar")saveAsg();
  else if(a==="remover")removeAcc(t.dataset.uid);
  else if(a==="recusar")recusar(t.dataset.uid);
  else if(a==="solicitar")solicitar();
  else if(a==="copiarmsg"){const m=$("#rqMsg");try{navigator.clipboard.writeText(m.value).then(()=>toast("Mensagem copiada."),()=>{m.select();toast("Selecione e copie a mensagem.")})}catch{m.select();toast("Selecione e copie a mensagem.")}}
  else if(a==="xlsx")exportXlsx();
  else if(a==="ecsv")exportExpCsv();
  else if(a==="padrao"){Object.keys(PLBL).forEach(k=>$("#p_"+k).value=DEF[k]);$("#p_VersaoRegra").value=DEF.VersaoRegra}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="ucQ"){S.ucQ=el.value;renderUcList();return}
  if(el.id==="asgQ"){S.asg.q=el.value;renderAsgList();return}
  if(el.id==="pSearch"){psSearch(el.value);return}
  if(el.dataset&&el.dataset.k&&S.form){const k=el.dataset.k;
    if(NUMK(k)){S.form[k]=el.value===""?null:Number(el.value)}else S.form[k]=el.value;
    if(el.dataset.sel&&NUMK(k))S.form[k]=el.value===""?null:Number(el.value);
    refreshCheck();return}
  if(el.id==="fQ"){S.fQ=el.value;const p=el.selectionStart;render();const n=$("#fQ");n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="vAs"){S.viewAs=el.value;S.form=null;S.edit=null;S.view=el.value==="gestor"?"minha":"painel";render()}
  else if(el.dataset&&el.dataset.em){toggle(S.exp.meas,el.dataset.em,el.checked);vExpRefresh()}
  else if(el.dataset&&el.dataset.ei){toggle(S.exp.items,el.dataset.ei,el.checked);vExpRefresh()}
  else if(el.dataset&&el.dataset.ec){toggle(S.exp.cats,el.dataset.ec,el.checked);vExpRefresh()}
  else if(el.id==="eResp"){S.exp.resp=el.checked;vExpRefresh()}
  else if(el.dataset&&el.dataset.asguc){toggle(S.asg.ucs,el.dataset.asguc,el.checked);const c=$("#asgCount");if(c)c.textContent=S.asg.ucs.size+" selecionada(s)"}
  else if(el.dataset&&el.dataset.asgger){toggle(S.asg.gers,el.dataset.asgger,el.checked)}
  else if(el.id==="fDemo"){S.hideDemo=el.checked;render()}
  else if(el.id==="fGer"){S.fGer=el.value;render()}
  else if(el.id==="fSt"){S.fSt=el.value;render()}
  else if(el.dataset&&el.dataset.sel&&S.form){const k=el.dataset.k;S.form[k]=NUMK(k)?(el.value===""?null:Number(el.value)):el.value;if(k==="Categoria"){const ci=CATS.indexOf(el.value);S.form.UCTipo=ci>=0?CAT_TIPO[ci]:""}refreshCheck()}
});
document.addEventListener("keydown",e=>{if(e.target.id==="ucQ"&&e.key==="Enter"){e.preventDefault();const m=ucMatches(S.ucQ);if(m.length===1)pickUc(m[0][1])}});
$("#dlg").addEventListener("close",()=>{S.asg=null;if(S.view!=="form")render()});
document.addEventListener("click",e=>{const m=e.target.closest("[data-fbmode]");if(m){fbMode(m.dataset.fbmode);return}const v=e.target.closest("[data-fbv]");if(v){fbVerify(v.dataset.fbv);return}const t=e.target.closest("[data-fb]");if(t&&t.dataset.fb==="logout"&&S.auth){S.loginOk="";S.auth.signOut()}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-fbform]");if(!f)return;e.preventDefault();fbEmail(f.dataset.fbform)});
boot();
</script>

</body></html>
