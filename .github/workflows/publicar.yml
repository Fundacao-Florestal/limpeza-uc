name: Testar e publicar

# Testa as regras do Firestore em todo push e pull request.
# Publica no Firebase (site + regras) a cada push no main, quando o projeto estiver configurado:
#   Settings > Secrets and variables > Actions
#     Variable  FIREBASE_PROJECT_ID        ID do projeto Firebase
#     Secret    FIREBASE_SERVICE_ACCOUNT   JSON da conta de serviço (ver README, passo 8)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

  publicar:
    needs: testar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publicar site e regras
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJETO: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only hosting,firestore:rules --project "$PROJETO" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
